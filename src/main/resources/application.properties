# ---------------------------------------------------------------------------
# SGMI - API REST (Spring Boot)
# Las credenciales NUNCA se escriben aqui: se leen de variables de entorno.
# En local se cargan desde el archivo .env (ver documentacion.md).
# En Render se configuran en el panel Environment del Web Service.
# ---------------------------------------------------------------------------

# Carga local del archivo .env como propiedades. En Render no existe y, al ser
# opcional, la aplicacion continua leyendo las variables del panel Environment.
spring.config.import=optional:file:./.env[.properties]

spring.application.name=gestor-mantenimiento

# Render asigna el puerto en la variable PORT; en local se usa 8080.
server.port=${PORT:8080}

# Base de datos PostgreSQL (local o Aiven). La URL debe incluir ?sslmode=require
# cuando el servidor es remoto.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Pool de conexiones. initialization-fail-timeout=-1 permite que la aplicacion
# arranque aunque PostgreSQL tarde en responder (Render reintenta al primer uso).
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.initialization-fail-timeout=-1

# JSON: fechas ISO-8601 (2026-11-04T10:15:30) y sin campos nulos.
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.default-property-inclusion=non_null

# Origenes permitidos para el frontend (lista separada por comas).
# En Render se puede sobreescribir con la variable CORS_ALLOWED_ORIGINS.
# El valor * permite cualquier origen porque la API no usa cookies ni credenciales.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:*}

# Logs mas concisos en produccion.
logging.level.root=INFO
logging.level.com.grupo7.sgmi=INFO
